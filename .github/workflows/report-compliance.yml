# Workflow name:
name: report-compliance

# Workflow triggers:
on:
  # Run daily:
  schedule:
  - cron: 0 12 * * *

  # Allow the workflow to be manually run:
  workflow_dispatch:

# Global permissions:
permissions:
  # Allow read-only access to the repository contents:
  contents: read

# Define global environment variables:
env:
  ARRAY_LIBRARY: array-api-strict
  ARRAY_LIBRARY_MODULE: array_api_strict
  ARRAY_API_VERSION: '2025.12'

# Workflow jobs:
jobs:

  # Define a job for running Array API tests...
  array_api_tests:

    # Define a display name:
    name: Report Array API compliance

    # Define the type of virtual host machine:
    runs-on: ubuntu-latest

    # Define the sequence of job steps...
    steps:

      # Check out of the test suite repository:
    - name: Checkout Array API test suite repository

        # Pin action to full length commit SHA:
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

        # Specify repository data:
      with:
        repository: data-apis/array-api-tests
        submodules: 'true'
        path: array-api-tests

      # Install Python:
    - name: Install Python

        # Pin action to full length commit SHA:
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0

        # Specify Python info:
      with:
        python-version: '3.14'

      timeout-minutes: 5

      # Install dependencies:
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ${GITHUB_WORKSPACE}/array-api-tests/requirements.txt
        python -m pip install pytest-xdist

      timeout-minutes: 10

      # Install the array library to test:
    - name: Install array library
      run: |
        python -m pip install ${{ env.ARRAY_LIBRARY }}

      timeout-minutes: 10

      # Run the test suite:
    - name: Run test suite
      id: tests

        # Allow subsequent steps to execute even if this one fails:
      continue-on-error: true

        # Set requisite environment variables:
      env:
          # Specify the array library name to test:
        ARRAY_API_TESTS_MODULE: ${{ env.ARRAY_LIBRARY_MODULE }}

          # Specify the array API version to test against:
        ARRAY_API_TESTS_VERSION: ${{ env.ARRAY_API_VERSION }}

        ARRAY_API_STRICT_VERSION: ${{ env.ARRAY_API_VERSION }}

        # Generate a JSON report:
      run: |
        cd ${GITHUB_WORKSPACE}/array-api-tests
        python -m pytest array_api_tests/ --max-examples 1000 -n 4 --derandomize --json-report

      timeout-minutes: 360

      # Add meta data to report:
    - name: Add meta data
      run: |
        cd "${GITHUB_WORKSPACE}/array-api-tests"
        if [ ! -f .report.json ]; then
            echo "::error::pytest did not produce .report.json"
            exit 1
        fi
        library_version="$(python -c "import importlib.metadata; print(importlib.metadata.version('${{ env.ARRAY_LIBRARY }}'))")"

        platform="$(python -c 'import platform; print(platform.platform())')"
        system="$(python -c 'import platform; print(platform.system())')"
        release="$(python -c 'import platform; print(platform.release())')"
        machine="$(python -c 'import platform; print(platform.machine())')"
        python_version="$(python -c 'import platform; print(platform.python_version())')"
        test_suite="$(git rev-parse HEAD)"

        jq \
          --arg schema 'v1' \
          --arg name '${{ env.ARRAY_LIBRARY }}' \
          --arg version "${library_version}" \
          --arg api_version '${{ env.ARRAY_API_VERSION }}' \
          --arg timestamp "$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" \
          --arg platform "${platform}" \
          --arg system "${system}" \
          --arg release "${release}" \
          --arg machine "${machine}" \
          --arg execution_target 'cpu' \
          --arg python_version "${python_version}" \
          --arg test_suite "${test_suite}" \
          '{
            schema: $schema,
            name: $name,
            version: $version,
            api_version: $api_version,
            timestamp: $timestamp,
            platform: {
              description: $platform,
              system: $system,
              release: $release,
              machine: $machine
            },
            execution_target: {
              kind: $execution_target
            },
            python: $python_version,
            test_suite: $test_suite,
            data: {
              duration: .duration,
              exitcode: .exitcode,
              summary: .summary,
              tests: .tests
            }
          }' \
          .report.json > array_api_compliance.json

      # Upload the JSON report:
    - name: Upload test suite results

        # Pin action to full length commit SHA:
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1

      with:
          # Define a name for the uploaded artifact:
        name: array_api_compliance.json

          # Specify the path to the file to upload:
        path: ${{ github.workspace }}/array-api-tests/array_api_compliance.json

          # Specify what should happen if no files are found to upload:
        if-no-files-found: error

          # Specify the number of days to retain the artifact (default is 90 days):
        retention-days: 45

      timeout-minutes: 10
    needs:
    - alpha_bridge_inputs
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  alpha_bridge_inputs:
    name: AlphaBridge input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: ${{ github.sha }}
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native scheduled-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport hashlib\nimport json\nimport os\nimport urllib.parse\n\
        import urllib.request\n\n\ndef changed(get, *, repository, run_id, identity,
        job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    query = urllib.parse.urlencode(\n \
        \       {\n            \"head_sha\": current[\"head_sha\"],\n            \"\
        event\": event,\n            \"per_page\": 100,\n        }\n    )\n    runs
        = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n    for run in runs[\"workflow_runs\"]:\n        if run[\"id\"] == run_id:\n\
        \            continue\n        if run.get(\"head_sha\") != current[\"head_sha\"\
        ] or run.get(\"event\") != event:\n            raise ValueError(\"provider
        returned a different CI input identity\")\n        page = 1\n        while
        True:\n            jobs = get(\n                f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={page}\"\
        \n            )[\"jobs\"]\n            for job in jobs:\n                if
        (\n                    job[\"name\"] == job_name\n                    and
        job.get(\"status\") == \"completed\"\n                    and job.get(\"conclusion\"\
        ) == \"success\"\n                    and any(\n                        step[\"\
        name\"] == f\"AlphaBridge input identity {identity}\"\n                  \
        \      and step.get(\"conclusion\") == \"success\"\n                     \
        \   for step in job.get(\"steps\", [])\n                    )\n          \
        \      ):\n                    return False\n            if len(jobs) < 100:\n\
        \                break\n            page += 1\n    return True\n\n\ndef main():\n\
        \    inputs = {\n        \"configuration_commit\": os.environ[\"AB_HEAD_SHA\"\
        ],\n        \"event\": os.environ[\"AB_EVENT\"],\n        \"schedule\": os.environ[\"\
        AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
        ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"\
        runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"ImageVersion\"\
        , \"\")],\n    }\n    identity = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    should_run = inputs[\"event\"\
        ] != \"schedule\" or changed(\n        get,\n        repository=os.environ[\"\
        AB_REPOSITORY\"],\n        run_id=int(os.environ[\"AB_RUN_ID\"]),\n      \
        \  identity=identity,\n        job_name=\"AlphaBridge input check\",\n   \
        \ )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\"\
        ) as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\"CI inputs changed\" if should_run else \"CI inputs unchanged;
        build and test jobs skipped\")\n\n\nif __name__ == \"__main__\":\n    main()\n\
        \nALPHA_BRIDGE_CI_PY\n"
    - name: AlphaBridge input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
